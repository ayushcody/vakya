name: CI
# Checks run locally first (./vakya test, and the pre-push hook from ./vakya hooks). GitHub only runs this for a release
# tag or when started by hand (Actions tab -> CI -> Run workflow), to save Actions minutes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg
      - name: Python packages
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same major version that writes package-lock.json locally; older npm reads the lock differently.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install, like ./vakya setup: a lock file written on macOS lacks some Linux-only optional packages
      # (@emnapi/* for the WebAssembly fallbacks), which makes npm ci refuse to install on Linux.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src --quiet
      - run: npx jest
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000
