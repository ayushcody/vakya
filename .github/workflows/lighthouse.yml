name: Lighthouse budget

# A separate workflow, so it never gates or delays the backend or frontend jobs in ci.yml.
# Budget thresholds live in frontend/lighthouserc.json (see frontend/README.md, "Performance budget").
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/lighthouse.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same major version as the frontend job in ci.yml (npm 11 writes the lock file).
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install, not npm ci: same reason as the frontend job in ci.yml (Linux-only optional packages).
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Starts `next start -p 3204`, runs 3 Lighthouse passes per URL (mobile emulation), checks
      # frontend/lighthouserc.json and uploads the reports to temporary public storage (the link is in the log).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
